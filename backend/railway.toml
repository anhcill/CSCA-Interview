# ============================================================
# railway.toml — Backend Service (Node.js + Prisma)
# Đặt file này trong thư mục backend/
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
